name: Dependabot auto-merge for semver patch, minor, or major
on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  dependabot:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.repository == 'invernizzi/luca-on-the-web'
    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"
      - name: Check for merge conflicts
        id: conflict_check
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          MERGEABLE="${{ github.event.pull_request.mergeable }}"

          # GitHub can send null mergeability early in the PR lifecycle.
          # Retry via API before deciding to skip approval.
          if [[ "$MERGEABLE" == "null" || -z "$MERGEABLE" ]]; then
            for _ in 1 2 3 4 5; do
              MERGEABLE="$(gh pr view "$PR_NUMBER" --repo "$REPO" --json mergeable --jq .mergeable || echo UNKNOWN)"
              if [[ "$MERGEABLE" != "UNKNOWN" && "$MERGEABLE" != "null" ]]; then
                break
              fi
              echo "PR merge status still unknown, retrying..."
              sleep 5
            done
          fi

          if [[ "$MERGEABLE" == "true" || "$MERGEABLE" == "MERGEABLE" ]]; then
            echo "has_conflicts=false" >> $GITHUB_OUTPUT
            echo "PR is mergeable with no conflicts"
          else
            # If mergeability is false/conflicting/unknown, skip approval.
            echo "has_conflicts=true" >> $GITHUB_OUTPUT
            if [[ "$MERGEABLE" == "false" || "$MERGEABLE" == "CONFLICTING" ]]; then
              echo "PR has merge conflicts"
            else
              echo "PR merge status is still being calculated or unknown"
            fi
          fi
      - name: Approve Dependabot PR if no conflicts
        if: steps.conflict_check.outputs.has_conflicts == 'false'
        continue-on-error: true
        run: gh pr review --repo "$REPO" --approve "$PR_NUMBER"
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
      - name: Enable auto-merge for Dependabot PRs
        if: steps.metadata.outputs.update-type == 'version-update:semver-patch' || steps.metadata.outputs.update-type == 'version-update:semver-minor' || steps.metadata.outputs.update-type == 'version-update:semver-major'
        run: gh pr merge --repo "$REPO" --auto --merge "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
